name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Lint, Schema & Vitest Suite (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vorixa_user
          POSTGRES_PASSWORD: vorixa_password
          POSTGRES_DB: vorixa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vorixa_user:vorixa_password@localhost:5432/vorixa_db?schema=public
      AUTH_SECRET: test-ci-secret-32-chars-long-minimum-key!
      PAYMENT_PROVIDER_MODE: test
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Synchronize Database Schema
        run: npx prisma db push --skip-generate

      - name: Seed Database
        run: npx prisma db seed

      - name: Lint Code
        run: npm run lint

      - name: Run Vitest Security & Integration Tests
        run: npm run test
