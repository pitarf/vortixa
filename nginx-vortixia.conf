# ==========================================
# BLOCO NGINX PARA VORTIXIA.COM.BR
# Arquivo: /etc/nginx/sites-available/vortixia.conf
# ==========================================

server {
    server_name vortixia.com.br www.vortixia.com.br;

    # Otimização de uploads de mídia e arquivos grandes (ex: imagens/vídeos de IA)
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts estendidos para requisições generativas e webhooks
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
