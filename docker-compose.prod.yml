version: '3.8'

services:
  # Aplicação Principal VORIXA (Next.js 16 Standalone)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vorixa-app
    restart: unless-stopped
    ports:
      - 127.0.0.1:3005:3000
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://:@postgres:5432/?schema=public
      - NEXTAUTH_URL=https://vortixia.com.br
      - NEXT_PUBLIC_APP_URL=https://vortixia.com.br
      - AUTH_SECRET=
      - NEXTAUTH_SECRET=
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
      - FAL_KEY=
      - GEMINI_API_KEY=
      - SMTP_HOST=
      - SMTP_PORT=
      - SMTP_SECURE=
      - SMTP_USER=
      - SMTP_PASS=
      - SMTP_FROM=
      - PAYMENT_PROVIDER=
      - PAYMENT_PROVIDER_MODE=
      - MERCADOPAGO_ACCESS_KEY=
      - STRIPE_SECRET_KEY=
      - STRIPE_WEBHOOK_SECRET=
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=
      - S3_SECRET_KEY=
      - S3_BUCKET=
      - S3_REGION=us-east-1
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - vorixa-network

  # Banco de Dados Relacional PostgreSQL 15 (ISOLADO NA REDE INTERNA)
  postgres:
    image: postgres:15-alpine
    container_name: vorixa-postgres
    restart: always
    environment:
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    # Sem bind de porta no Host para evitar qualquer conflito com a 5432 existente
    volumes:
      - vorixa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U -d ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vorixa-network

  # Object Storage S3 Compatível Local (MinIO)
  minio:
    image: minio/minio
    container_name: vorixa-minio
    restart: always
    ports:
      - 127.0.0.1:9010:9000
      - 127.0.0.1:9011:9001
    environment:
      MINIO_ROOT_USER: 
      MINIO_ROOT_PASSWORD: 
    command: server /data --console-address :9001
    volumes:
      - vorixa-minio-data:/data
    networks:
      - vorixa-network

volumes:
  vorixa-postgres-data:
    driver: local
  vorixa-minio-data:
    driver: local

networks:
  vorixa-network:
    driver: bridge
