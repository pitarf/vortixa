version: '3.8'

services:
  # Storage S3 Local (MinIO)
  minio:
    image: minio/minio
    container_name: vorixa-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
    driver: local
