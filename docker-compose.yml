version: '3.8'

services:
  # Aplicação Principal VORIXA (Next.js 16 Standalone)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vorixa-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://vorixa_user:vorixa_password@postgres:5432/vorixa_db?schema=public
      - AUTH_SECRET=${AUTH_SECRET:-change_in_production_secret_key_vorixa_2026}
      - FAL_KEY=${FAL_KEY:-}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-mock_gateway}
      - PAYMENT_PROVIDER_MODE=${PAYMENT_PROVIDER_MODE:-mock}
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - vorixa-network

  # Banco de Dados Relacional PostgreSQL 15 com Volume Persistente
  postgres:
    image: postgres:15-alpine
    container_name: vorixa-postgres
    restart: always
    environment:
      POSTGRES_USER: vorixa_user
      POSTGRES_PASSWORD: vorixa_password
      POSTGRES_DB: vorixa_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - vorixa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vorixa_user -d vorixa_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vorixa-network

  # Object Storage S3 Compatível Local (MinIO)
  minio:
    image: minio/minio
    container_name: vorixa-minio
    restart: always
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    volumes:
      - vorixa-minio-data:/data
    networks:
      - vorixa-network

volumes:
  vorixa-postgres-data:
    external: true
  vorixa-minio-data:
    external: true

networks:
  vorixa-network:
    driver: bridge
